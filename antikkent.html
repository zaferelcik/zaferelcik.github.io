<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Saklı Tiyatrolar — Anadolu'nun Ücretsiz Antik Kentleri</title>
<meta name="description" content="Anadolu'daki 27 antik kentin interaktif haritası. Tiyatroları, ulaşım bilgilerini ve keşif notlarını keşfedin.">

<link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>

<style>
/* ========== CSS VARIABLES & RESET ========== */
:root {
  --bg: #1a1714;
  --bg-elevated: #231f1b;
  --bg-surface: #2a2520;
  --text: #e8dcc8;
  --text-muted: #a89a86;
  --gold: #c49a5c;
  --gold-dim: rgba(196,154,92,0.15);
  --gold-bright: #d4aa6c;
  --border: rgba(196,154,92,0.12);
  --shadow: rgba(0,0,0,0.4);
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  /* Region colors */
  --likya: #c49a5c;
  --karya: #7eb89b;
  --pisidya: #b07ec4;
  --pamfilya: #5c9ec4;
  --kilikya: #c47e7e;
  /* Access colors */
  --uzak: #c47e7e;
  --orta: #c4b05c;
  --kolay: #7ec47e;
}

[data-theme="light"] {
  --bg: #f5f0e8;
  --bg-elevated: #ffffff;
  --bg-surface: #ede7db;
  --text: #2a2520;
  --text-muted: #6b5f50;
  --gold: #a07838;
  --gold-dim: rgba(160,120,56,0.1);
  --gold-bright: #b08848;
  --border: rgba(160,120,56,0.15);
  --shadow: rgba(0,0,0,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100dvh;
  overflow: hidden;
  position: relative;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
a { color: var(--gold); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ========== HEADER ========== */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: var(--bg-elevated);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 52px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.logo-mark {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  color: var(--gold);
}

.header-text {
  flex: 1;
  min-width: 0;
}

.header-title {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.15;
  letter-spacing: 0.02em;
}

.header-subtitle {
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.icon-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  transition: background 0.15s;
  color: var(--text-muted);
}
.icon-btn:hover { background: var(--gold-dim); }
.icon-btn.active { color: var(--gold); background: var(--gold-dim); }
.icon-btn svg { width: 18px; height: 18px; }

/* ========== FILTER BAR ========== */
.filter-bar {
  position: fixed;
  top: 52px;
  left: 0;
  right: 0;
  z-index: 99;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 6px 12px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-surface);
  color: var(--text-muted);
  border: 1px solid var(--border);
  transition: all 0.15s;
  white-space: nowrap;
  min-height: 32px;
  display: flex;
  align-items: center;
}
.chip:hover { border-color: var(--gold); }
.chip.active {
  background: var(--gold-dim);
  color: var(--gold);
  border-color: var(--gold);
}
.chip-separator {
  flex-shrink: 0;
  width: 1px;
  height: 20px;
  background: var(--border);
  align-self: center;
}

/* ========== MAP ========== */
.map-container {
  position: fixed;
  top: 88px;
  left: 0;
  right: 0;
  bottom: 0;
}
#map {
  width: 100%;
  height: 100%;
}

.maplibregl-ctrl-attrib { font-size: 10px !important; }
.maplibregl-ctrl-attrib a { color: var(--text-muted) !important; }

/* Custom markers */
.marker {
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.marker:hover { transform: scale(1.2); }
.marker-dot {
  border-radius: 50%;
  background: var(--gold);
  border: 2.5px solid var(--bg-elevated);
  box-shadow: 0 0 8px rgba(196,154,92,0.5), 0 2px 4px rgba(0,0,0,0.3);
  position: relative;
}
.marker-dot::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: rgba(196,154,92,0.15);
  animation: pulse 2.5s ease-in-out infinite;
}
.marker.active .marker-dot {
  background: #fff;
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(196,154,92,0.8), 0 2px 8px rgba(0,0,0,0.4);
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.6); opacity: 0; }
}

/* ========== BOTTOM SHEET ========== */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.sheet-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.bottom-sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 201;
  background: var(--bg-elevated);
  border-radius: 16px 16px 0 0;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 85dvh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -4px 24px var(--shadow);
}
.bottom-sheet.open {
  transform: translateY(0);
}

.sheet-handle-area {
  padding: 8px 0;
  display: flex;
  justify-content: center;
  cursor: grab;
  flex-shrink: 0;
  touch-action: none;
}
.sheet-handle {
  width: 36px;
  height: 4px;
  background: var(--text-muted);
  border-radius: 2px;
  opacity: 0.4;
}

.sheet-header {
  padding: 0 16px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.sheet-title-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}

.rank-badge {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--gold);
  color: var(--bg);
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sheet-site-name {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 20px;
  font-weight: 700;
  line-height: 1.2;
  flex: 1;
}

.sheet-close-btn {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg-surface);
  color: var(--text-muted);
  transition: background 0.15s;
}
.sheet-close-btn:hover { background: var(--border); }
.sheet-close-btn svg { width: 16px; height: 16px; }

.sheet-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.badge-region { background: var(--gold-dim); color: var(--gold); }
.badge-region[data-region="Karya"] { background: rgba(126,184,155,0.15); color: var(--karya); }
.badge-region[data-region="Pisidya"] { background: rgba(176,126,196,0.15); color: var(--pisidya); }
.badge-region[data-region="Pamfilya"] { background: rgba(92,158,196,0.15); color: var(--pamfilya); }
.badge-region[data-region="Kilikya"] { background: rgba(196,126,126,0.15); color: var(--kilikya); }

.badge-access { font-size: 11px; }
.badge-access[data-access="Uzak"] { background: rgba(196,126,126,0.15); color: var(--uzak); }
.badge-access[data-access="Orta"] { background: rgba(196,176,92,0.15); color: var(--orta); }
.badge-access[data-access="Kolay"] { background: rgba(126,196,126,0.15); color: var(--kolay); }

.badge-fee {
  background: var(--bg-surface);
  color: var(--text-muted);
}

.sheet-body {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
}

.sheet-section {
  margin-bottom: 16px;
}
.sheet-section-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.sheet-section p {
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
}
.sheet-section .detail-text {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
}

.sheet-links {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sheet-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  color: var(--text);
  transition: border-color 0.15s;
  min-height: 44px;
}
.sheet-link:hover { border-color: var(--gold); text-decoration: none; }
.sheet-link svg { flex-shrink: 0; width: 18px; height: 18px; color: var(--gold); }
.sheet-link-text {
  flex: 1;
  min-width: 0;
}
.sheet-link-title {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sheet-link-subtitle {
  font-size: 11px;
  color: var(--text-muted);
}
.sheet-link-arrow { flex-shrink: 0; color: var(--text-muted); width: 14px; height: 14px; }

/* ========== LIST VIEW ========== */
.list-view {
  position: fixed;
  top: 88px;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--bg);
  z-index: 50;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: none;
  padding: 12px;
}
.list-view.visible { display: block; }

.site-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.site-card:hover { border-color: var(--gold); }
.site-card:active { transform: scale(0.99); }

.card-rank {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--gold-dim);
  color: var(--gold);
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-content { flex: 1; min-width: 0; }

.card-name {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 4px;
}

.card-badges {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}

.card-excerpt {
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-muted);
  display: -webkit-box;
  line-clamp: 2;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ========== FOOTER ========== */
.list-footer {
  padding: 20px 12px 32px;
  text-align: center;
}
.list-footer-text {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.list-footer a {
  font-size: 11px;
  color: var(--text-muted);
  opacity: 0.7;
}
.list-footer a:hover { color: var(--gold); opacity: 1; }

/* Map footer */
.map-footer {
  position: fixed;
  bottom: 8px;
  left: 12px;
  z-index: 10;
  font-size: 10px;
  color: var(--text-muted);
  opacity: 0.6;
  pointer-events: auto;
}
.map-footer a { color: var(--text-muted); }
.map-footer a:hover { color: var(--gold); }

/* ========== SITE COUNT PILL ========== */
.site-count {
  position: fixed;
  bottom: 16px;
  right: 12px;
  z-index: 10;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 8px var(--shadow);
}
.site-count .count-dot {
  width: 6px;
  height: 6px;
  background: var(--gold);
  border-radius: 50%;
}

/* ========== DESKTOP ENHANCEMENTS ========== */
@media (min-width: 768px) {
  .header { padding: 8px 20px; height: 56px; }
  .header-title { font-size: 17px; }
  .header-subtitle { font-size: 11px; }
  .filter-bar { top: 56px; padding: 8px 20px; gap: 8px; }
  .chip { padding: 6px 14px; font-size: 13px; }
  .map-container { top: 92px; }
  .list-view { top: 92px; padding: 16px 20px; }

  .bottom-sheet {
    left: auto;
    right: 16px;
    bottom: 16px;
    width: 400px;
    border-radius: 16px;
    max-height: calc(100dvh - 120px);
  }
  .bottom-sheet.open {
    transform: translateY(0);
  }

  .list-view {
    max-width: 720px;
    margin: 0 auto;
  }
}

@media (min-width: 1024px) {
  .bottom-sheet { width: 420px; }
  .list-view {
    max-width: 900px;
    display: none;
  }
  .list-view.visible {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    align-content: start;
  }
  .list-view.visible .site-card { margin-bottom: 0; }
  .list-view.visible .list-footer { grid-column: 1 / -1; }
}
</style>
</head>

tion.","v":"Remote mountain site in national park, ruins integrated with modern village houses using ancient materials; untouched by mass tourism, authentic rugged atmosphere with theater visible from afar amid terraced fields and canyons.","rk":12,"su":"Toros Dağları'nın güney yamacında, 1250 metre yükseklikte yer alan Selge Antik Kenti, muhteşem antik tiyatrosu ve sakin dağ atmosferiyle ziyaretçileri büyülüyor. 9000 kişilik tiyatrosu kayalara oyulmuş, stadyum ve agora kalıntılarıyla çevrili; Roma döneminin ihtişamını yansıtıyor. Köprülü Kanyon'dan virajlı yolla ulaşılıyor, Altınkaya Köyü'nde tarihle doğa iç içe, huzurlu bir ziyaret deneyimi sunuyor.","au":"https://gezimanya.com/antalya/gezilecek-yerler/selge-antik-kenti","at":"Selge Antik Kenti - Gezimanya","as":"Gezimanya","wt":"https://tr.wikipedia.org/wiki/Selge"},{"n":"Rhodiapolis","la":36.38694,"lo":30.26556,"r":"Lycia","rc":"Likya","nr":"Kumluca (7-10km, 10 min drive uphill)","ac":"Orta","ad":"Orta (well signposted paved road from Kumluca, steep climb, not major tourist site but accessible)","f":"Free (visitor center under construction, possible future fee)","tc":"Partially restored/reconstructed (some new stonework); cavea 70% exposed and well-preserved; stage building preserved; ongoing restoration criticized in places.","v":"Compact hilltop Roman city like Kyaneai; overgrown until recent excavations, off-beaten-path Lycian site with theater, baths, tombs; rugged terrain, views over greenhouses.","rk":13,"su":"Rhodiapolis Antik Kenti, Antalya'nın Kumluca ilçesine 2,5 km kuzeyinde, çam ormanları içinde yer alan gizemli bir Likya şehri. En dikkat çeken yapısı, 1500 kişilik küçük Grek tiyatrosu olup, sahne binası kısmen korunmuş halde güneye bakıyor; Opramoas'ın anıt mezarı ise Anadolu'nun en uzun antik Yunanca yazıtını barındırıyor. Kumluca'dan dar yolla kolayca ulaşılıyor, orman yürüyüşleri ve terk edilmiş evlerle dolu tepede sakin, mistik bir atmosfer hakim; ziyaretçiler antik taş evler arasında tarihle baş başa kalıyor.","au":"https://sanat-magazin.com/yazarlarimiz/sahikaoner/rhodiapolis-antik-kenti-kumluca/","at":"RHODİAPOLİS ANTİK KENTİ & KUMLUCA","as":"İstanbul Sanat Magazin","wt":"https://tr.wikipedia.org/wiki/Rhodiapolis"},{"n":"Ariassos","la":37.18111,"lo":30.4725,"r":"Pisidia","rc":"Pisidya","nr":"Dağbeli/Akkoç Köyü","ac":"Orta","ad":"Orta","f":"Ücretsiz","tc":"Unknown; likely ruined/advanced destruction like other non-gate structures","v":"Uncrowded mountain pass ruins on slopes, hiking required, unguarded/free access, overgrown minor structures, Pisidian sarcophagi necropolis, forgotten site","rk":14,"su":"Toros Dağları'nın eteklerinde, Antalya'ya 50 km kuzeyde yer alan Ariassos Antik Kenti, iyi korunmuş üç kemerli anıtsal şehir kapısı, tiyatro kalıntıları, hamamlar, agora ve nekropolleriyle dikkat çeker. Sakin ve gizemli atmosferi ile tarih severleri büyüleyen site, Akkoç Köyü yakınından kolayca ulaşılabilir; Antalya-Burdur yolundan saparak kısa bir yolculukla varılır. Ziyaretçiler, çam ormanları arasında antik yolları keşfederek huzurlu bir zaman yolculuğu yapar, dağ havasının ferahlığında kalıntıları fotoğraflayarak unutulmaz anlar biriktirir.","au":"https://www.gzt.com/foto-galeri/seyahat/ariassos-antik-kenti-tarihle-dag-havasinin-bulustugu-yer-2046979","at":"Ariassos Antik Kenti: Tarihle dağ havasının buluştuğu yer & Ariassos Antik Kenti – Antalya - Gezi Fotoğrafları ve Blog Sayfası","as":"GZT, gezcek.com Blog","wt":"https://tr.wikipedia.org/wiki/Ariassos"},{"n":"Syedra","la":36.44111,"lo":32.1525,"r":"Cilicia (westernmost)/Pamphylia border","rc":"Pamfilya","nr":"Seki (Alanya district)","ac":"Uzak","ad":"Uzak","f":"Free (no fee mentioned on official sites; Tripadvisor confirms)","tc":"Partially excavated and cleaned; seating rows and stage not yet reached; previously overgrown/vegetated, now visible structure; ongoing works to reveal more.","v":"Hilltop ruins with panoramic sea/mountain views; lesser-known, no crowds; ongoing excavations; rugged uphill access like remote Lycian sites.","rk":15,"su":"Alanya’nın 20 km doğusundaki Syedra Antik Kenti, MÖ 9. yüzyıla uzanan tarihiyle stratejik bir dağ-kıyı yerleşimi sunar; 250 metre uzunluğundaki sütunlu caddesi, iyi korunmuş büyük hamam, gymnasium ve vaftiz mağarası gibi yapılarla dikkat çeker. Ahşap yürüme yolları ve merdivenlerle kolayca gezilebilen kentte, Akdeniz’in muhteşem manzarası eşliğinde huzurlu bir atmosfer hakimdir; tepeye tırmanırken Alanya Kalesi’ni gören panoramik seyirler ziyaretçiyi büyüler. Ücretsiz girişli bu gizli cennette, tarih ve doğa birleşerek unutulmaz bir deneyim yaşatır; yazın su ve şapka getirmeyi unutmayın.","au":"https://antalya.ktb.gov.tr/TR-317596/syedra.html","at":"Syedra","as":"Antalya KT B","wt":"https://tr.wikipedia.org/wiki/Syedra"},{"n":"Iasos","la":37.2775,"lo":27.586,"r":"Caria","rc":"Karya","nr":"Kıyıkışlacık","ac":"Orta","ad":"Orta","f":"Free (2024)","tc":"Ruined; only fragments survive, marble stripped in 1887","v":"Rarely visited fishing village site; partially overgrown, picturesque over bay, quiet atmospheric ruins with sea views from acropolis","rk":16,"su":"Iasos Antik Kenti, Muğla Milas'taki Kıyıkışlacık'ta üç tarafı denizle çevrili huzurlu bir yarımada üzerinde yer alır ve Helenistik tiyatrosu ile Bouleuterion'u en iyi korunmuş yapıları arasındadır. Atmosferi sakin ve balıkçı köyüyle iç içe, ziyaretçiler agora, mozaikli evler, Balık Pazarı Müzesi'ni gezip mendirek kulesini denizden izleyebilir. Milas'tan 18 km karayolu veya Güllük'ten deniz yoluyla ulaşılır, ücretsiz girişle antik liman kenarında çay molası vererek keyifli bir deneyim yaşatır.","au":"https://kucukdunya.com/iasos-karyada-bir-liman-kenti/","at":"İasos Antik Kenti - Karia Liman Kenti | Küçük Dünya | Gezi Rehberi","as":"Küçük Dünya Gezi Rehberi","wt":"https://tr.wikipedia.org/wiki/K%C4%B1y%C4%B1k%C4%B1%C5%9Flac%C4%B1k,_Milas"},{"n":"Alinda","la":37.55833,"lo":27.82361,"r":"Caria","rc":"Karya","nr":"Karpuzlu","ac":"Orta","ad":"Orta (steep hill climb from small town, off main tourist path but accessible by car/taxi)","f":"Free","tc":"Well-preserved but overgrown with vegetation and olive trees","v":"Overgrown theater with trees on seats, authentic unrestored ruins on hilltop fortress overlooking plain, mixed with modern village life using ancient stones, strenuous hike adds remote feel","rk":17,"su":"Aydın'ın Karpuzlu ilçesinde yer alan Alinda Antik Kenti, Karya Kraliçesi Ada'nın sürgündeki kalesi olarak tarihe damga vurmuş, zeytin ağaçları arasında huzurlu bir atmosfere sahip görkemli bir yerdir. Anadolu'nun nadir üç katlı agoralarından biri ve iyi korunmuş Helenistik tiyatrosuyla ziyaretçileri büyüler. Aydın merkezden minibüsle kolayca ulaşılıp ücretsiz gezilen kentte, surlar, su kemerleri ve akropol manzarası eşliğinde antik dönemin izlerini keşfetmek eşsiz bir deneyim sunar.","au":"https://kucukdunya.com/alinda-karya-uygarliginin-gorkemli-kenti/","at":"Alinda Antik Kenti - Bir Karia Şehri | Küçük Dünya | Gezi Rehberi","as":"Küçük Dünya Gezi Rehberi","wt":"https://tr.wikipedia.org/wiki/Alinda"},{"n":"Alabanda","la":37.5919,"lo":27.98497,"r":"Caria","rc":"Karya","nr":"Araphisar / Doğanyurt (Çine, Aydın)","ac":"Orta","ad":"Orta (rural village location, dirt roads, not major tourist site)","f":"Ücretsiz (free)","tc":"Mixed preservation: seating largely robbed, substructures (barrel-vaulted corridors) well-preserved, marble seats visible, ongoing excavations.","v":"Rural setting with farms and village built over ruins, peaceful countryside atmosphere, ongoing excavations, similar off-beaten-path feel.","rk":18,"su":"Aydın'ın Çine ilçesinde yer alan Alabanda Antik Kenti, 4000 yıllık tarihiyle Helenistik dönemden kalma muhteşem bir antik tiyatrosu, senato binası, hamamlar ve Apollon Tapınağı gibi yapılarıyla dikkat çekiyor. Sessiz ve huzurlu atmosferi, Kızlarhisarı efsanesiyle zenginleşerek ziyaretçilere mistik bir deneyim sunuyor. Çine merkezden 7-9 km uzaklıkta kolayca ulaşılabilir; doğanın içinde antik kalıntılar arasında dolaşmak, tarihe yolculuk hissi veriyor.","au":"https://www.turkishmuseums.com/blog/detail/alabanda-oren-yeri-ve-kizlarhisari-efsanesi/10103/1","at":"Alabanda Ören Yeri ve Kızlarhisarı Efsanesi","as":"Turkish Museums, Gezimanya","wt":"https://tr.wikipedia.org/wiki/Alabanda_(antik_kent"},{"n":"Pessinus (Ballıhisar)","la":39.3314,"lo":31.5833,"r":"Phrygia/Galatia","rc":"Frigya","nr":"Ballıhisar, Sivrihisar (Eskişehir)","ac":"Orta","ad":"Orta (Ankara'ya 150 km, Eskişehir'e 100 km, köy yoluyla)","f":"Ücretsiz","tc":"Harap — iki ayrı tiyatro yapısı (tapınak-tiyatro + 8.000 kişilik Roma tiyatrosu), oturma sıraları sökülebilmiş","v":"Kybele kültünün dünya merkezi, köyün tam ortasında antik kalıntılar, neredeyse hiç ziyaretçi yok, mistik atmosfer","au":"http://ozlemcegeziyorum.blogspot.com/2017/03/ana-tanrca-kibelenin-sehri-pessinus.html","at":"Ana Tanrıça, Kibele'nin Şehri \"Pessinus\"","as":"Özlem'ce Gezi-Yorum","wt":"https://tr.wikipedia.org/wiki/Pessinus","su":"Pessinus Antik Kenti, Frigya Kralı Midas tarafından Ana Tanrıça Kibele’ye adanmış kutsal bir tapınak kenti olarak özel bir yere sahiptir; gökten indiği söylenen siyah taş heykeliyle ünlenmiştir. Kentte, tapınakla bağlantılı merdivenli tiyatro ile doğu tepesindeki Hadrianus dönemine ait 8000 kişilik büyük tiyatro kalıntıları dikkat çeker. Huzurlu Ballıhisar köyü ortasında, terk edilmiş evler ve koyun sürüleri arasında mistik bir atmosfere sahip olan site, Eskişehir’in kültür mirası hazinesidir. Ankara-Eskişehir karayolu üzerinden Sivrihisar’a 13 km güneye, Ballıhisar köyüne kolayca araçla ulaşabilirsiniz.","rk":19},{"n":"Alexandria Troas","la":39.7517,"lo":26.1586,"r":"Troas","rc":"Troas","nr":"Dalyan köyü, Ezine (Çanakkale)","ac":"Uzak","ad":"Uzak (400 hektarlık meşe ormanında, altyapı yok)","f":"Ücretsiz","tc":"Gömülü/kazı devam ediyor — 12.000 kişilik, 2024'te keşfedildi","v":"400 hektarlık meşe ormanıyla kaplı hayalet kent, gişe yok, dev surlar, Bozcaada manzarası","au":"https://selgideranilarkalir.com/2024/06/yine-yeniden-canakkale-2-alexandria-troas-ve-neandria/","at":"Yine Yeniden Çanakkale (2): Alexandria Troas ve Neandria","as":"Sel Gider Anılar Kalır","wt":"https://tr.wikipedia.org/wiki/Aleksandreia_Troas","su":"Çanakkale'nin Ezine ilçesinde, Dalyan köyü yakınlarında yer alan Alexandria Troas Antik Kenti, Büyük İskender'in komutanları tarafından kurulan ve Roma döneminde Hadrianus ile Herodes Atticus'un katkılarıyla Anadolu'nun en büyük hamamına ev sahipliği yapan devasa bir yerleşimle özeldir; limanı sayesinde ticaret merkezi olmuş, erken Hristiyanlıkta Aziz Paulus'un uğrak yeri olarak hac merkezi statüsü kazanmıştır. Kentin en yüksek noktasındaki antik tiyatro, muhteşem manzarasıyla Bozcaada, Midilli Adası ve Çanakkale Boğazı'nı izleme imkanı sunar. Zeytinlikler ve çalılıklar arasında gizli kalıntılarla dolu sakin ve keşif dolu atmosferi, derli toplu olmayan yapısıyla maceracı bir gezi vaat eder. Assos'tan 50-60 dakika uzaklıkta, Dalyan yolundan tabelasız ulaşılan siteye araçla kolayca gidilebilir, liman kalıntıları için sahile inilir.","rk":20},{"n":"Aigai (Nemrut Kale)","la":38.8311,"lo":27.1886,"r":"Aeolis","rc":"Aiolis","nr":"Köseler köyü, Yunusemre (Manisa)","ac":"Uzak","ad":"Uzak (dağ başı, dar yol, az ziyaretçi)","f":"Ücretsiz","tc":"Helenistik kökenli, Roma döneminde yenilenmiş, kazılar devam ediyor","v":"Dağ başı Aiolis kenti, surlar içinde tiyatro ve bouleuterion, az ziyaretçi, keşif atmosferi","au":"https://www.yerelmanisa.com.tr/manisa-gezilecek-yerler/aigai-antik-kentinin-sakli-kalmis-guzelligi/","at":"Aigai Antik Kenti'nin Saklı Kalmış Güzelliği","as":"Yerel Manisa","wt":"https://tr.wikipedia.org/wiki/Aigai","su":"Manisa'nın Yunt Dağı eteklerindeki Aigai Antik Kenti, sahil kentlerinden farklı olarak dağlık ve bakir bir konumda yer alır; keçi yetiştiriciliğiyle ünlü, üç katlı agorası ve parşömen üretimiyle Pergamon'a katkı sağlayan özel bir Aiolis yerleşimidir.[Yerel Manisa](https://www.yerelmanisa.com.tr/manisa-gezilecek-yerler/aigai-antik-kentinin-sakli-kalmis-guzelligi/) Yamaca yaslanmış antik tiyatrosu, muhteşem vadi manzarasıyla doğa ve tarih iç içe bir deneyim sunar.[Yerel Manisa](https://www.yerelmanisa.com.tr/manisa-gezilecek-yerler/aigai-antik-kentinin-sakli-kalmis-guzelligi/) Kalabalıktan uzak, sakin ve meditatif atmosferiyle kaplumbağalar eşliğinde gezinti yapılan bu gizli cennet, Manisa merkezden 49 km uzaklıkta Köseler Mahallesi'nde olup özel araç veya dolmuşla ulaşılabilir; giriş ücretsizdir.[Yerel Manisa](https://www.yerelmanisa.com.tr/manisa-gezilecek-yerler/aigai-antik-kentinin-sakli-kalmis-guzelligi/) [BBC Türkçe](https://www.bbc.com/turkce/articles/cewypxvjpgxo) [Vikipedi](https://tr.wikipedia.org/wiki/Aigai)","rk":21},{"n":"Anavarza (Anazarbus)","la":37.2486,"lo":35.9,"r":"Cilicia","rc":"Kilikya","nr":"Dilekkaya, Kozan (Adana)","ac":"Uzak","ad":"Uzak (Adana'ya 70 km, köy yolu)","f":"Ücretsiz","tc":"15.000 kişilik kısmen korunmuş tiyatro, kayalara oyulmuş oturma sıraları","v":"Çukurova ortasında devasa kaya kütlesi eteklerinde, UNESCO adayı, amfiteatr ve stadyum da var, nefes kesici manzara","au":"https://gezimanya.com/adana/gezilecek-yerler/anavarza-antik-kenti","at":"Anavarza Antik Kenti","as":"Gezimanya","wt":"https://tr.wikipedia.org/wiki/Anavarza","su":"Anavarza Antik Kenti, Çukurova ovasının ortasında yükselen 200 metre yüksekliğindeki kaya kütlesi eteklerinde yer alan, Kilikya'nın en büyük metropollerinden biri olarak özel bir yere sahip; Helenistik, Roma, Bizans ve Ermeni uygarlıklarının izlerini taşıyan devasa yapısı ve UNESCO Geçici Miras Listesi'ndeki konumuyla dikkat çeker. Antik tiyatro, amfiteatr, stadyum ve sütunlu duble cadde gibi kalıntılarla dolu kentte, nefes kesici manzaralı kale tepesinden ovaya hakim muhteşem bir atmosfer yaşanır. Adana şehir merkezinden 70 km kuzeydoğuya, Kozan-Dilekkaya yolu üzerinden otomobille kolayca ulaşılabilir; Ceyhan-Kozan yolundan saparak 5 km sonra varırsınız.","rk":22},{"n":"Prusias ad Hypium (Konuralp)","la":40.9061,"lo":31.1481,"r":"Bithynia","rc":"Bitinya","nr":"Konuralp, Düzce","ac":"Orta","ad":"Orta (Düzce'den 8 km, ulaşımı kolay)","f":"Ücretsiz","tc":"İyi korunmuş — oturma sıraları, sahne binası, tonozlu geçitler mevcut, kazılar devam ediyor","v":"Yeşillikler içinde açık hava tiyatrosu, modern Konuralp mahallesinin içinde antik kent, sakin atmosfer","au":"https://www.ibrahiminyeri.com/post/konuralp-prusias-ad-hypium-antik-kenti-duzce","at":"Konuralp – Prusias ad Hypium Antik Kenti: Düzce’nin Binlerce Yıllık Mirası","as":"ibrahiminyeri.com","wt":"https://tr.wikipedia.org/wiki/Prusias_Ad_Hypium","su":"Düzce Konuralp'teki Prusias ad Hypium Antik Kenti, \"Batı Karadeniz'in Efes'i\" olarak anılan, Helenistik ve Roma dönemlerine ait muhteşem kalıntılarıyla özel bir yerdir. Yaklaşık 10.000 kişilik antik tiyatrosu, iki kademeli yapısı, tonozlu geçitleri ve aslan pençeli süslemeleriyle dikkat çeker; halk arasında \"Kırk Basamaklar\" diye bilinir. Tepe üzerinde, Melen Çayı manzarasıyla mistik bir atmosfere sahip olan kentte, surlar, su kemerleri ve Roma köprüsü gibi yapılar da ziyaretçiyi büyüler. Düzce merkezden 5-8 km kuzeyde, kolayca araçla ulaşılabilir; sabah saatlerinde gezmek idealdir.","rk":23},{"n":"İznik (Nikaia) Roma Tiyatrosu","la":40.4268,"lo":29.7169,"r":"Bithynia","rc":"Bitinya","nr":"İznik, Bursa","ac":"Kolay","ad":"Kolay (İznik şehir merkezinde, kolayca ulaşılır)","f":"Ücretsiz","tc":"2024'te restorasyonla ziyarete açıldı, iyi korunmuş, oturma sıraları ve sahne binası görülebilir","v":"Tarihi İznik surları içinde, 1. Konsil kenti, göl kenarında atmosferik, yeni restore edilmiş","au":"https://gezibilen.com/travelpoint/bursa/iznik-roma-tiyatrosu","at":"İznik Roma Tiyatrosu - GeziBilen Dijital Rehber","as":"GeziBilen","wt":"https://tr.wikipedia.org/wiki/%C4%B0znik","su":"Bursa’nın İznik ilçesinde, antik Nikaia kentinin kalbinde yer alan Roma Tiyatrosu, MS 2. yüzyılda İmparator Traianus döneminde inşa edilmiş 15.000 kişilik devasa bir yapıdır ve Türkiye’deki Roma tiyatroları arasında mimar // ========== STATE ==========
let map, markers = [], activeMarker = null;
let currentView = 'map'; // 'map' | 'list'
let filters = { region: 'all', access: 'all' };
let isDark = true;

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  initFilters();
  initThemeToggle();
  initListToggle();
  initSheet();
  renderList();
});

// ========== MAP ==========
function getStyleUrl() {
  return isDark
    ? 'https://tiles.openfreemap.org/styles/dark'
    : 'https://tiles.openfreemap.org/styles/positron';
}

function initMap() {
  map = new maplibregl.Map({
    container: 'map',
    style: getStyleUrl(),
    center: [30.0, 37.0],
    zoom: 6.2,
    attributionControl: true,
    maxZoom: 15,
    minZoom: 4,
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');

  map.on('load', () => {
    addMarkers();
    // Fit to all markers on initial load
    const bounds = new maplibregl.LngLatBounds();
    SITES.forEach(s => bounds.extend([s.lo, s.la]));
    map.fitBounds(bounds, { padding: { top: 20, bottom: 60, left: 20, right: 20 }, maxZoom: 9 });
  });
}

function addMarkers() {
  clearMarkers();
  const filtered = getFilteredSites();

  filtered.forEach(site => {
    const el = document.createElement('div');
    el.className = 'marker';
    el.dataset.rank = site.rk;

    const size = site.rk <= 10 ? 16 : 12;
    const dot = document.createElement('div');
    dot.className = 'marker-dot';
    dot.style.width = size + 'px';
    dot.style.height = size + 'px';
    el.appendChild(dot);

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      openSite(site);
    });

    const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
      .setLngLat([site.lo, site.la])
      .addTo(map);

    markers.push({ marker, el, site });
  });

  updateCount(filtered.length);
}

function clearMarkers() {
  markers.forEach(m => m.marker.remove());
  markers = [];
  activeMarker = null;
}

function setActiveMarker(site) {
  markers.forEach(m => {
    m.el.classList.toggle('active', m.site.rk === site.rk);
  });
}

// ========== FILTERS ==========
function getFilteredSites() {
  return SITES.filter(s => {
    if (filters.region !== 'all' && s.rc !== filters.region) return false;
    if (filters.access !== 'all' && s.ac !== filters.access) return false;
    return true;
  });
}

function initFilters() {
  document.querySelectorAll('.chip[data-filter]').forEach(chip => {
    chip.addEventListener('click', () => {
      const type = chip.dataset.filter;
      const value = chip.dataset.value;
      filters[type] = value;

      document.querySelectorAll(`.chip[data-filter="${type}"]`).forEach(c => {
        c.classList.toggle('active', c.dataset.value === value);
      });

      addMarkers();
      renderList();
      closeSheet();
      fitToMarkers();
    });
  });
}

function fitToMarkers() {
  const filtered = getFilteredSites();
  if (filtered.length === 0) return;
  if (filtered.length === 1) {
    map.flyTo({ center: [filtered[0].lo, filtered[0].la], zoom: 10, duration: 800 });
    return;
  }
  const bounds = new maplibregl.LngLatBounds();
  filtered.forEach(s => bounds.extend([s.lo, s.la]));
  map.fitBounds(bounds, { padding: { top: 20, bottom: 60, left: 20, right: 20 }, duration: 800, maxZoom: 12 });
}

function updateCount(count) {
  const regions = new Set(getFilteredSites().map(s => s.rc));
  document.getElementById('countText').textContent =
    `${count} antik kent • ${regions.size} bölge`;
}

// ========== THEME ==========
function initThemeToggle() {
  const btn = document.getElementById('themeToggle');
  const moonIcon = document.getElementById('moonIcon');
  const sunIcon = document.getElementById('sunIcon');

  btn.addEventListener('click', () => {
    isDark = !isDark;
    document.body.dataset.theme = isDark ? 'dark' : 'light';
    moonIcon.style.display = isDark ? '' : 'none';
    sunIcon.style.display = isDark ? 'none' : '';
    map.setStyle(getStyleUrl());
    map.once('style.load', () => {
      addMarkers();
    });
  });
}

// ========== LIST TOGGLE ==========
function initListToggle() {
  const btn = document.getElementById('listToggle');
  const listView = document.getElementById('listView');
  const mapContainer = document.getElementById('mapContainer');
  const siteCount = document.getElementById('siteCount');
  const mapFooter = document.getElementById('mapFooter');

  btn.addEventListener('click', () => {
    if (currentView === 'map') {
      currentView = 'list';
      btn.classList.add('active');
      listView.classList.add('visible');
      siteCount.style.display = 'none';
      mapFooter.style.display = 'none';
    } else {
      currentView = 'map';
      btn.classList.remove('active');
      listView.classList.remove('visible');
      siteCount.style.display = '';
      mapFooter.style.display = '';
    }
  });
}

function switchToMap(site) {
  currentView = 'map';
  document.getElementById('listToggle').classList.remove('active');
  document.getElementById('listView').classList.remove('visible');
  document.getElementById('siteCount').style.display = '';
  document.getElementById('mapFooter').style.display = '';
  map.flyTo({ center: [site.lo, site.la], zoom: 12, duration: 1200 });
  setTimeout(() => openSite(site), 600);
}

// ========== LIST RENDERING ==========
function renderList() {
  const listView = document.getElementById('listView');
  const filtered = getFilteredSites().sort((a, b) => a.rk - b.rk);

  let html = '';
  filtered.forEach(site => {
    const excerpt = site.su.substring(0, 120) + '…';
    html += `
      <div class="site-card" data-rank="${site.rk}" onclick="switchToMap(SITES.find(s=>s.rk===${site.rk}))">
        <div class="card-rank">${site.rk}</div>
        <div class="card-content">
          <div class="card-name">${site.n}</div>
          <div class="card-badges">
            <span class="badge badge-region" data-region="${site.rc}">${site.rc}</span>
            <span class="badge badge-access" data-access="${site.ac}">${site.ac}</span>
          </div>
          <div class="card-excerpt">${excerpt}</div>
        </div>
      </div>
    `;
  });

  html += `
    <div class="list-footer">
      <div class="list-footer-text">${filtered.length} antik kent • ${new Set(filtered.map(s => s.rc)).size} bölge</div>
    </div>
  `;

  listView.innerHTML = html;
}

// ========== BOTTOM SHEET ==========
function initSheet() {
  const overlay = document.getElementById('sheetOverlay');
  const closeBtn = document.getElementById('sheetClose');

  overlay.addEventListener('click', closeSheet);
  closeBtn.addEventListener('click', closeSheet);

  // Drag to dismiss
  let startY = 0, currentTranslate = 0, isDragging = false;
  const handle = document.getElementById('sheetHandle');
  const sheet = document.getElementById('bottomSheet');

  function onDragStart(e) {
    isDragging = true;
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    sheet.style.transition = 'none';
  }

  function onDragMove(e) {
    if (!isDragging) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const delta = y - startY;
    if (delta > 0) {
      currentTranslate = delta;
      sheet.style.transform = `translateY(${delta}px)`;
    }
  }

  function onDragEnd() {
    if (!isDragging) return;
    isDragging = false;
    sheet.style.transition = '';
    if (currentTranslate > 120) {
      closeSheet();
    } else {
      sheet.style.transform = 'translateY(0)';
    }
    currentTranslate = 0;
  }

  handle.addEventListener('touchstart', onDragStart, { passive: true });
  handle.addEventListener('touchmove', onDragMove, { passive: true });
  handle.addEventListener('touchend', onDragEnd);
  handle.addEventListener('mousedown', onDragStart);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

  // Fly to site
  map.flyTo({
    center: [site.lo, site.la],
    zoom: Math.max(map.getZoom(), 10),
    duration: 800,
    padding: { bottom: 300 }
  });
}

function closeSheet() {
  const sheet = document.getElementById('bottomSheet');
  const overlay = document.getElementById('sheetOverlay');
  sheet.classList.remove('open');
  sheet.style.transform = 'translateY(100%)';
  overlay.classList.remove('visible');
  markers.forEach(m => m.el.classList.remove('active'));
}
</script>

(function(){
  if(window===window.top)return;

    if(orig.nodeType!==1)return;
    try{
      var cs=getComputedStyle(orig);
      var t='';
      for(var i=0;i<cs.length;i++){t+=cs[i]+':'+cs.getPropertyValue(cs[i])+';';}
      clone.style.cssText=t;
    }catch(e){}
    var oc=orig.children,cc=clone.children;
    for(var j=0;j<oc.length&&j<cc.length;j++){inlineAll(oc[j],cc[j]);}
  }
  function stripExternal(clone){
    var imgs=clone.querySelectorAll('img');
    for(var i=0;i<imgs.length;i++){
      var s=imgs[i].getAttribute('src');
      if(s&&!s.startsWith('data:'))imgs[i].removeAttribute('src');
    }
    var all=clone.querySelectorAll('*');
    for(var i=0;i<all.length;i++){
      var st=all[i].style.cssText;
      if(st&&st.indexOf('url(')>=0){
        all[i].style.cssText=st.replace(/url\(["']?(?!data:)[^)"']*["']?\)/gi,'none');
      }
    }
  }
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='INLINE_EDIT_CAPTURE_REQUEST')return;
    var scrollX=window.scrollX||window.pageXOffset||0;
    var scrollY=window.scrollY||window.pageYOffset||0;
    var w=window.innerWidth,h=window.innerHeight;
    try{
      var clone=document.documentElement.cloneNode(true);
      var rm=clone.querySelectorAll('script,link[rel="stylesheet"],style');
      for(var i=0;i<rm.length;i++){rm[i].remove();}
      inlineAll(document.documentElement,clone);
      stripExternal(clone);
      var html=new XMLSerializer().serializeToString(clone);
      var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
        +'<foreignObject width="100%" height="100%">'
        +'<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;overflow:hidden">'
        +'<div style="transform:translate(-'+scrollX+'px,-'+scrollY+'px);transform-origin:top left">'
        +html+'</div></div></foreignObject></svg>';
      var svgUrl='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
      var img=new Image();
      img.onload=function(){
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0);
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:c.toDataURL('image/png'),scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.onerror=function(){
        window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
      };
      img.src=svgUrl;
    }catch(err){
      window.parent.postMessage({type:'INLINE_EDIT_SCREENSHOT_RESULT',dataUrl:null,scrollX:scrollX,scrollY:scrollY},'*');
    }
  });
})();
